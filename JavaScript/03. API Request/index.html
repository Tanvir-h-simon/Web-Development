<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="cat-icon">🐱</div>
        <h1>Cat Facts</h1>
        <p class="subtitle">Click the button to get a random cat fact</p>

        <div class="fact-box" id="fact-box">
            <p id="fact-text">Your cat fact will appear here...</p>
        </div>

        <button id="fetch-btn">Get a Cat Fact</button>

        <p class="status" id="status"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
