<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h3 id="high-score">High Score: 0</h3>
    <h2>Press <b>Enter</b> to start the game!</h2>
    <div class="btn-container">
        <div class="row">
            <button class="btn red" id="red"></button>
            <button class="btn green" id="green"></button>
        </div>
        <div class="row">
            <button class="btn blue" id="blue"></button>
            <button class="btn yellow" id="yellow"></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
