<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions and Transforms</title>
    <link rel="stylesheet" href="04. style.css">
</head>
<body>
    <h1>CSS Transitions and Transforms Demo</h1>
    
    <div class="container">
        <div class="box rotate-box">
            <h3>Rotate</h3>
            <p>Hover to rotate 360 degrees</p>
        </div>

        <div class="box scale-box">
            <h3>Scale</h3>
            <p>Hover to enlarge</p>
        </div>

        <div class="box translate-box">
            <h3>Translate</h3>
            <p>Hover to move right</p>
        </div>

        <div class="box skew-box">
            <h3>Skew</h3>
            <p>Hover to distort</p>
        </div>

        <div class="box combined-box">
            <h3>Combined</h3>
            <p>Hover for multiple effects</p>
        </div>
    </div>

    <button>Interactive Button</button>
</body>
</html>
