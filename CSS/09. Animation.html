<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="09. style.css">
</head>
<body>
    <h1>CSS Animation Examples</h1>
    
    <!-- Slide Animation -->
    <h2>Slide Animation</h2>
    <div class="container">
        <div class="box slide">Slide</div>
    </div>

    <!-- Fade Animation -->
    <h2>Fade Animation</h2>
    <div class="container">
        <div class="box fade">Fade</div>
    </div>

    <!-- Rotate Animation -->
    <h2>Rotate Animation</h2>
    <div class="container">
        <div class="box rotate">Rotate</div>
    </div>

    <!-- Bounce Animation -->
    <h2>Bounce Animation</h2>
    <div class="container">
        <div class="box bounce">Bounce</div>
    </div>

    <!-- Scale Animation -->
    <h2>Scale (Pulse) Animation</h2>
    <div class="container">
        <div class="box scale">Scale</div>
    </div>

    <!-- Color Change Animation -->
    <h2>Color Change Animation</h2>
    <div class="container">
        <div class="box color-change">Color Change</div>
    </div>

    <!-- Shake Animation -->
    <h2>Shake Animation</h2>
    <div class="container">
        <div class="box shake">Shake</div>
    </div>

    <!-- Flip Animation -->
    <h2>Flip Animation</h2>
    <div class="container">
        <div class="box flip">Flip</div>
    </div>

    <!-- Combined Animation -->
    <h2>Combined Animation (Slide + Rotate)</h2>
    <div class="container">
        <div class="box combined">Combined</div>
    </div>
</body>
</html>
