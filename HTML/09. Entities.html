<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entities</h1>
    <p>HTML entities are used to display reserved characters in HTML.</p>
    <p>Here are some common HTML entities:</p>
    <ul>
        <li>&amp; - Ampersand (&)</li>
        <li>&lt; - Less than (<)</li>
        <li>&gt; - Greater than (>)</li>
        <li>&quot; - Double quote (")</li>
        <li>&apos; - Single quote (')</li>
        
    </ul>
</body>
</html>
