<!DOCTYPE html> <!-- This declaration defines the document type and version of HTML being used. It helps browsers to render the page correctly.-->
<html> <!-- This is the root element of an HTML document. It contains all other elements and content of the webpage.-->
    <head> <!-- The head element contains meta-information about the document, such as its title, character encoding, and links to stylesheets or scripts. It does not contain content that is displayed on the webpage itself. -->
        <title>My First Webpage</title> <!-- The title element specifies the title of the webpage, which is displayed in the browser's title bar or tab. It is important for SEO and user experience. -->
    </head>
    <body> <!-- The body element contains the content of the webpage that is displayed to users. This includes text, images, links, and other media. -->
        <h1>Main Heading</h1>
        <p>Hello World!</p>
        <p>I'm learning <i>HTML</i>.</p>
        <p>This is my <b>first</b> webpage.</p>

        <h3>Subheading:</h3>
        <p>
            HTML stands for <u>HyperText Markup Language</u>. <br><!-- The <br> element is a line break, which creates a new line in the text.-->
            HTML is used to <b>create webpages</b>.

        </p> 

        <p>
            <hr> <!-- hr: horizontal rule -->
            HTML stands for <u>HyperText Markup Language</u>.
            HTML is used to <b>create webpages</b>.
        </p>    
</html>
