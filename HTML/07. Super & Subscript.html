<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super and Subscript</title>
</head>
<body>
    <h1>Super and Subscript</h1>
    <p>Superscript: a<sup>2</sup> + b<sup>2</sup></p>
    <p>Subscript: H<sub>2</sub>O</p> 

    <p>Superscript: a<sup><i>2</i></sup> + b<sup><i>2</i></sup></p>
    <p>Subscript: H<sub><b>2</b></sub>O</p> 
</body>
</html>
