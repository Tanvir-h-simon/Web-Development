<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists and Attributes in HTML</title>
</head>
<body>
    <ul> <!-- The unordered list element (<ul>) is used to create a list of items where the order does not matter.-->
        <li>Item 1</li> <!-- The list item element (<li>) is used to define an individual item within a list. It can contain text, images, links, or even other lists.-->
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol> <!-- The ordered list element (<ol>) is used to create a list of items where the order does matter.-->
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type="a"> <!-- The type attribute of the ordered list element (<ol>) specifies the numbering style for the list items.-->
        <li>Step 1: Gather materials</li>
        <li>Step 2: Follow instructions</li>
        <li>Step 3: Complete the task</li>
    </ol>
    <ul>
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Cherry</li>
            </ul>
        </li>
        <li>Vegetables
            <ul>
                <li>Carrot</li>
                <li>Broccoli</li>
                <li>Spinach</li>
            </ul>
        </li>
    </ul>
</body>
</html>
